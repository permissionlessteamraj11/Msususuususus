services:
  - type: worker
    name: PritiMusic
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
